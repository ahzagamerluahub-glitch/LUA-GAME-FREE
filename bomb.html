<!DOCTYPE html>
<html>
<body style="margin:0;background:black">
<button onclick="location.href='index.html'">⬅ Menu</button>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
c.width=800;c.height=500;

let n=parseInt(new URLSearchParams(location.search).get("players"))||2;
const keys=["a","s","d","f","g","h"];

let players=[];
let bombs=[];

for(let i=0;i<n;i++){
 players.push({x:100+i*80,y:250,key:keys[i],alive:true});
}

onkeydown=e=>{
 players.forEach(p=>{
  if(e.key==p.key && p.alive){
   bombs.push({x:p.x,y:p.y,t:60});
  }
 });
};

function loop(){
 ctx.fillStyle="#111";
 ctx.fillRect(0,0,800,500);

 let alive=players.filter(p=>p.alive);

 if(alive.length<=1){
  ctx.fillStyle="yellow";
  ctx.font="40px Arial";
  ctx.fillText("WINNER!",300,250);
  return;
 }

 players.forEach(p=>{
  if(!p.alive) return;
  ctx.fillStyle="cyan";
  ctx.fillRect(p.x,p.y,20,20);
 });

 bombs.forEach(b=>{
  b.t--;
  if(b.t==0){
   players.forEach(p=>{
    let d=Math.hypot(p.x-b.x,p.y-b.y);
    if(d<50) p.alive=false;
   });
  }

  ctx.fillStyle=b.t>0?"white":"orange";
  ctx.fillRect(b.x,b.y,10,10);
 });

 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
