<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomb Dodge 2D - Multiplayer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .game-container {
            text-align: center;
        }
        canvas {
            border: 3px solid #fff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8C8 100%);
        }
        .controls {
            margin-top: 15px;
            font-size: 18px;
        }
        .player-info {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 20px;
            font-size: 24px;
            display: none;
        }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #ff5252;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>💣 BOMB DODGE 2D 💣</h1>
        <div class="player-info">
            <div>Player 1 (WASD): <span id="p1-score">0</span></div>
            <div>Player 2 (Arrow Keys): <span id="p2-score">0</span></div>
        </div>
        <canvas id="gameCanvas" width="1000" height="600"></canvas>
        <div class="controls">
            Player 1: WASD | Player 2: Arrow Keys
        </div>
        
        <div id="gameOver" class="game-over">
            <h2 id="winnerText">Game Over!</h2>
            <p id="finalScore"></p>
            <button onclick="restartGame()">Main Lagi</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gameRunning = true;
        let bombs = [];
        let particles = [];
        let scoreP1 = 0;
        let scoreP2 = 0;

        // Player objects
        const player1 = {
            x: 100,
            y: 400,
            width: 30,
            height: 30,
            speed: 5,
            color: '#ff6b6b',
            keys: { w: false, a: false, s: false, d: false }
        };

        const player2 = {
            x: 850,
            y: 400,
            width: 30,
            height: 30,
            speed: 5,
            color: '#4ecdc4',
            keys: { up: false, down: false, left: false, right: false }
        };

        // Input handling
        document.addEventListener('keydown', (e) => {
            // Player 1 (WASD)
            if (e.key.toLowerCase() === 'w') player1.keys.w = true;
            if (e.key.toLowerCase() === 'a') player1.keys.a = true;
            if (e.key.toLowerCase() === 's') player1.keys.s = true;
            if (e.key.toLowerCase() === 'd') player1.keys.d = true;
            
            // Player 2 (Arrow Keys)
            if (e.key === 'ArrowUp') player2.keys.up = true;
            if (e.key === 'ArrowDown') player2.keys.down = true;
            if (e.key === 'ArrowLeft') player2.keys.left = true;
            if (e.key === 'ArrowRight') player2.keys.right = true;
        });

        document.addEventListener('keyup', (e) => {
            // Player 1
            if (e.key.toLowerCase() === 'w') player1.keys.w = false;
            if (e.key.toLowerCase() === 'a') player1.keys.a = false;
            if (e.key.toLowerCase() === 's') player1.keys.s = false;
            if (e.key.toLowerCase() === 'd') player1.keys.d = false;
            
            // Player 2
            if (e.key === 'ArrowUp') player2.keys.up = false;
            if (e.key === 'ArrowDown') player2.keys.down = false;
            if (e.key === 'ArrowLeft') player2.keys.left = false;
            if (e.key === 'ArrowRight') player2.keys.right = false;
        });

        // Bomb class
        class Bomb {
            constructor() {
                this.x = Math.random() * (canvas.width - 40) + 20;
                this.y = -40;
                this.width = 30;
                this.height = 40;
                this.speed = 3 + Math.random() * 3;
                this.rotation = 0;
                this.rotationSpeed = 0.1;
            }

            update() {
                this.y += this.speed;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                ctx.rotate(this.rotation);
                ctx.fillStyle = '#333';
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(-8, -12, 16, 16);
                ctx.fillStyle = '#ffff44';
                ctx.fillRect(-6, -10, 12, 8);
                ctx.restore();
            }
        }

        // Particle system for explosion
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.color = `hsl(${Math.random()*60 + 20}, 100%, 50%)`;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2; // gravity
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Update players movement
        function updatePlayer(player) {
            if (player.keys.w && player.y > 0) player.y -= player.speed;
            if (player.keys.s && player.y < canvas.height - player.height) player.y += player.speed;
            if (player.keys.a && player.x > 0) player.x -= player.speed;
            if (player.keys.d && player.x < canvas.width - player.width) player.x += player.speed;

            // Player 2 arrow keys
            if (player === player2) {
                if (player.keys.up && player.y > 0) player.y -= player.speed;
                if (player.keys.down && player.y < canvas.height - player.height) player.y += player.speed;
                if (player.keys.left && player.x > 0) player.x -= player.speed;
                if (player.keys.right && player.x < canvas.width - player.width) player.x += player.speed;
            }
        }

        // Spawn bombs
        function spawnBomb() {
            if (Math.random() < 0.02 + (scoreP1 + scoreP2) * 0.0001) {
                bombs.push(new Bomb());
            }
        }

        // Game over check
        function checkGameOver() {
            bombs.forEach((bomb, index) => {
                if (checkCollision(player1, bomb)) {
                    gameRunning = false;
                    createExplosion(player1.x + player1.width/2, player1.y + player1.height/2);
                    setTimeout(() => showGameOver('Player 2 Menang! 🎉'), 1000);
                }
                if (checkCollision(player2, bomb)) {
                    gameRunning = false;
                    createExplosion(player2.x + player2.width/2, player2.y + player2.height/2);
                    setTimeout(() => showGameOver('Player 1 Menang! 🎉'), 1000);
                }
            });
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(x, y));
            }
        }

        function showGameOver(winner) {
            document.getElementById('winnerText').textContent = winner;
            document.getElementById('finalScore').textContent = 
                `Skor Final - P1: ${scoreP1} | P2: ${scoreP2}`;
            document.getElementById('gameOver').style.display = 'block';
        }

        function restartGame() {
            gameRunning = true;
            bombs = [];
            particles = [];
            player1.x = 100;
            player1.y = 400;
            player2.x = 850;
            player2.y = 400;
            scoreP1 = 0;
            scoreP2 = 0;
            document.getElementById('gameOver').style.display = 'none';
        }

        // Main game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameRunning) {
                // Update players
                updatePlayer(player1);
                updatePlayer(player2);

                // Spawn and update bombs
                spawnBomb();
                bombs = bombs.filter(bomb => {
                    bomb.update();
                    return bomb.y < canvas.height + 50;
                });

                // Check collisions
                checkGameOver();

                // Update particles
                particles = particles.filter(particle => {
                    particle.update();
                    return particle.life > 0;
                });

                // Dodge bonus (bombs pass bottom)
                bombs.forEach(bomb => {
                    if (bomb.y > canvas.height) {
                        if (bomb.x < canvas.width / 2) scoreP1++;
                        else scoreP2++;
                    }
                });

                // Update scores
                document.getElementById('p1-score').textContent = scoreP1;
                document.getElementById('p2-score').textContent = scoreP2;
            }

            // Draw everything
            bombs.forEach(bomb => bomb.draw());
            particles.forEach(particle => particle.draw());

            // Draw players
            ctx.fillStyle = player1.color;
            ctx.fillRect(player1.x, player1.y, player1.width, player1.height);
            ctx.fillStyle = '#fff';
            ctx.fillRect(player1.x + 8, player1.y + 8, 6, 6); // mata

            ctx.fillStyle = player2.color;
            ctx.fillRect(player2.x, player2.y, player2.width, player2.height);
            ctx.fillStyle = '#fff';
            ctx.fillRect(player2.x + 16, player2.y + 8, 6, 6); // mata

            // Draw instructions
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.font = '20px Arial';
            ctx.fillText('Hindari BOMBA!', canvas.width/2 - 80, 30);

            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
