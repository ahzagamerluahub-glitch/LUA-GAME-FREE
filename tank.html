<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Battle Royale - Multiplayer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(45deg, #0f0f23, #1a1a3e, #2a2a5e);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            border: 3px solid #00ff88;
            box-shadow: 0 0 30px #00ff88;
            background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460);
            display: block;
            margin: 0 auto;
        }

        .ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
        }

        .btn {
            background: linear-gradient(45deg, #ff006e, #8338ec);
            border: none;
            color: white;
            padding: 12px 24px;
            margin: 5px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,0,110,0.4);
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255,0,110,0.6);
        }

        .btn-large {
            padding: 15px 30px;
            font-size: 18px;
        }

        .player-info {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .player-score {
            background: rgba(0,255,136,0.2);
            padding: 10px 15px;
            border-radius: 15px;
            border: 2px solid #00ff88;
        }

        .menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .hidden {
            display: none !important;
        }

        .win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #00ff88, #00cc66);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,255,136,0.5);
            z-index: 300;
        }

        @media (max-width: 768px) {
            canvas {
                width: 100%;
                height: 100vh;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="ui">
            <div>WASD/Arrows: Move | SPACE: Shoot</div>
            <div class="player-info" id="playerInfo"></div>
        </div>

        <canvas id="gameCanvas" width="1200" height="700"></canvas>

        <div class="controls">
            <button class="btn" onclick="startGame()">START GAME</button>
            <button class="btn" onclick="addPlayer()">+ PLAYER</button>
            <button class="btn" onclick="connectUSB()">USB MODE</button>
        </div>

        <!-- Main Menu -->
        <div class="menu" id="mainMenu">
            <h1 style="font-size: 48px; margin-bottom: 30px; text-shadow: 0 0 20px #00ff88;">⚡ TANK BATTLE ⚡</h1>
            <div style="margin-bottom: 30px;">
                <button class="btn btn-large" onclick="setPlayers(2)">2 PLAYER</button>
                <button class="btn btn-large" onclick="setPlayers(4)">4 PLAYER</button>
                <button class="btn btn-large" onclick="setPlayers(3)">3 PLAYER</button>
            </div>
            <div>
                <button class="btn" onclick="usbMode()">USB CONNECT</button>
            </div>
        </div>

        <!-- Win Screen -->
        <div class="win-screen hidden" id="winScreen">
            <h2 id="winnerText" style="font-size: 36px; margin-bottom: 20px;">PLAYER X MENANG!</h2>
            <div style="margin-bottom: 30px; font-size: 24px;">Score: <span id="finalScore">10</span></div>
            <button class="btn btn-large" onclick="backToLua()">BACK TO LUA GAMES</button>
            <button class="btn btn-large" onclick="restartGame()">MAIN LAGI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mainMenu = document.getElementById('mainMenu');
        const winScreen = document.getElementById('winScreen');

        // Responsive canvas
        function resizeCanvas() {
            const size = Math.min(window.innerWidth, window.innerHeight * 0.9);
            canvas.width = size;
            canvas.height = size * 0.7;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game State
        let gameState = {
            players: [],
            bullets: [],
            particles: [],
            powerups: [],
            map: [],
            keys: {},
            gameRunning: false,
            playerCount: 2,
            scores: [0, 0, 0, 0],
            usbMode: false
        };

        // Player Class
        class Player {
            constructor(id, color, controls) {
                this.id = id;
                this.x = Math.random() * (canvas.width - 100) + 50;
                this.y = Math.random() * (canvas.height - 100) + 50;
                this.angle = 0;
                this.speed = 2;
                this.health = 100;
                this.color = color;
                this.size = 25;
                this.lastShot = 0;
                this.controls = controls;
                this.score = 0;
                this.alive = true;
            }

            update() {
                if (!this.alive) return;

                // Movement
                if (gameState.keys[this.controls.up]) {
                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed;
                }
                if (gameState.keys[this.controls.down]) {
                    this.x -= Math.cos(this.angle) * this.speed;
                    this.y -= Math.sin(this.angle) * this.speed;
                }
                if (gameState.keys[this.controls.left]) this.angle -= 0.05;
                if (gameState.keys[this.controls.right]) this.angle += 0.05;

                // Boundaries
                this.x = Math.max(this.size, Math.min(canvas.width - this.size, this.x));
                this.y = Math.max(this.size, Math.min(canvas.height - this.size, this.y));

                // Shooting
                if (gameState.keys[this.controls.shoot] && Date.now() - this.lastShot > 300) {
                    gameState.bullets.push(new Bullet(
                        this.x + Math.cos(this.angle) * this.size,
                        this.y + Math.sin(this.angle) * this.size,
                        this.angle,
                        this.id
                    ));
                    this.lastShot = Date.now();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Tank body
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Tank barrel
                ctx.fillStyle = '#333';
                ctx.shadowColor = '#333';
                ctx.shadowBlur = 10;
                ctx.fillRect(0, -3, 25, 6);

                // Health bar
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(-this.size, -this.size - 10, this.size * 2, 6);
                ctx.fillStyle = `hsl(${100 - this.health * 2}, 100%, 50%)`;
                ctx.fillRect(-this.size, -this.size - 10, (this.size * 2) * (this.health / 100), 6);

                ctx.restore();

                // Player number
                ctx.fillStyle = 'white';
                ctx.font = 'bold 20px Courier';
                ctx.textAlign = 'center';
                ctx.fillText(this.id + 1, this.x, this.y - 35);
            }
        }

        // Bullet Class
        class Bullet {
            constructor(x, y, angle, ownerId) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * 8;
                this.vy = Math.sin(angle) * 8;
                this.ownerId = ownerId;
                this.life = 100;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }

            draw() {
                ctx.fillStyle = '#ff4444';
                ctx.shadowColor = '#ff4444';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Particle Class
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 30;
                this.color = color;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2;
                this.life--;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life / 30;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Input handling
        document.addEventListener('keydown', (e) => {
            gameState.keys[e.code] = true;
        });

        document.addEventListener('keyup', (e) => {
            gameState.keys[e.code] = false;
        });

        // Multiplayer controls
        function setupControls() {
            // Player 1: WASD + SPACE
            gameState.players[0].controls = {
                up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', shoot: 'Space'
            };

            if (gameState.playerCount >= 2) {
                // Player 2: Arrows
                gameState.players[1].controls = {
                    up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', shoot: 'Enter'
                };
            }

            if (gameState.playerCount >= 3) {
                // Player 3: Custom keys
                gameState.players[2].controls = {
                    up: 'KeyI', down: 'KeyK', left: 'KeyJ', right: 'KeyL', shoot: 'KeyO'
                };
            }

            if (gameState.playerCount >= 4) {
                // Player 4: Numpad
                gameState.players[3].controls = {
                    up: 'Numpad8', down: 'Numpad2', left: 'Numpad4', right: 'Numpad6', shoot: 'Numpad5'
                };
            }
        }

        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Game loop
        function gameLoop() {
            if (!gameState.gameRunning) return;

            // Clear canvas
            ctx.fillStyle = 'rgba(26, 26, 46, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update & draw players
            gameState.players.forEach(player => {
                player.update();
                player.draw();
            });

            // Update & draw bullets
            for (let i = gameState.bullets.length - 1; i >= 0; i--) {
                const bullet = gameState.bullets[i];
                bullet.update();

                // Bullet collision with players
                for (let j = 0; j < gameState.players.length; j++) {
                    const player = gameState.players[j];
                    if (player.id !== bullet.ownerId && player.alive) {
                        const dist = Math.hypot(bullet.x - player.x, bullet.y - player.y);
                        if (dist < player.size) {
                            // Hit!
                            player.health -= 25;
                            for (let k = 0; k < 10; k++) {
                                gameState.particles.push(new Particle(player.x, player.y, player.color));
                            }
                            gameState.bullets.splice(i, 1);

                            if (player.health <= 0) {
                                player.alive = false;
                                gameState.scores[bullet.ownerId]++;
                                gameState.players[bullet.ownerId].score++;

                                // Check win condition
                                if (gameState.scores[bullet.ownerId] >= 10) {
                                    showWinScreen(bullet.ownerId);
                                    return;
                                }
                            }
                            break;
                        }
                    }
                }

                // Remove off-screen bullets
                if (bullet.x < 0 || bullet.x > canvas.width || 
                    bullet.y < 0 || bullet.y > canvas.height || bullet.life <= 0) {
                    gameState.bullets.splice(i, 1);
                } else {
                    bullet.draw();
                }
            }

            // Update & draw particles
            for (let i = gameState.particles.length - 1; i >= 0; i--) {
                const particle = gameState.particles[i];
                particle.update();
                particle.draw();
                if (particle.life <= 0) {
                    gameState.particles.splice(i, 1);
                }
            }

            // Update UI
            updateUI();

            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            const info = document.getElementById('playerInfo');
            info.innerHTML = gameState.players.map((p, i) => 
                `<div class="player-score">
                    P${i+1}: ${p.score} 
                    ${p.alive ? `❤️${p.health}` : '💀'}
                </div>`
            ).join('');
        }

        // Game functions
        function startGame() {
            gameState.gameRunning = true;
            mainMenu.classList.add('hidden');
            setupControls();
            gameLoop();
        }

        function setPlayers(count) {
            gameState.playerCount = count;
            gameState.players = [];
            const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff8c42'];
            
            for (let i = 0; i < count; i++) {
                gameState.players.push(new Player(i, colors[i], {}));
            }
            gameState.scores = new Array(count).fill(0);
        }

        function addPlayer() {
            if (gameState.playerCount < 4) {
                setPlayers(gameState.playerCount + 1);
            }
        }

        function usbMode() {
            gameState.usbMode = true;
            alert('USB Mode aktif! Sambungkan device lain untuk 3-4 player');
            setPlayers(4);
        }

        function connectUSB() {
            gameState.usbMode = true;
            setPlayers(4);
        }

        function showWinScreen(winner) {
            gameState.gameRunning = false;
            document.getElementById('winnerText').textContent = `PLAYER ${winner + 1} MENANG!`;
            document.getElementById('finalScore').textContent = gameState.scores[winner];
            winScreen.classList.remove('hidden');
        }

        function restartGame() {
            winScreen.classList.add('hidden');
            gameState.gameRunning = false;
            setPlayers(gameState.playerCount);
            startGame();
        }

        function backToLua() {
            window.location.href = 'https://ahzagamerluahub-glitch.github.io/LUA-GAME-FREE/index.html';
        }

        // Touch controls for mobile
        let touchControls = {};
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            Array.from(e.touches).forEach((touch, i) => {
                touchControls[i] = { x: touch.clientX, y: touch.clientY };
            });
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchControls = {};
        });

        // Initialize
        setPlayers(2);
        updateUI();
    </script>
</body>
</html>
