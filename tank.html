<!DOCTYPE html>
<html>
<body style="margin:0;background:black;">
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
c.width=800;c.height=500;

const keys=["a","s","d","f","g","h"];
let players=[];
let bullets=[];

const url=new URLSearchParams(location.search);
let n=parseInt(url.get("players"))||2;

for(let i=0;i<n;i++){
 players.push({x:100+i*80,y:250,a:0,color:`hsl(${i*60},100%,50%)`,move:false});
}

onkeydown=e=>{
 players.forEach((p,i)=>{
  if(e.key==keys[i]){
   p.move=true;
   bullets.push({x:p.x,y:p.y,a:p.a});
  }
 });
};

onkeyup=e=>{
 players.forEach((p,i)=>{
  if(e.key==keys[i]) p.move=false;
 });
};

function loop(){
 ctx.fillStyle="#111";
 ctx.fillRect(0,0,800,500);

 players.forEach(p=>{
  if(p.move){
   p.x+=Math.cos(p.a)*2;
   p.y+=Math.sin(p.a)*2;
   p.a+=0.05;
  }

  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.a);
  ctx.fillStyle=p.color;
  ctx.fillRect(-10,-10,20,20);
  ctx.restore();
 });

 bullets.forEach(b=>{
  b.x+=Math.cos(b.a)*5;
  b.y+=Math.sin(b.a)*5;
  ctx.fillStyle="yellow";
  ctx.fillRect(b.x,b.y,5,5);
 });

 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
