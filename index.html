<!DOCTYPE html>
<html>
<head>
  <title>🎮 FREE GAME LUA HUB</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@400;600;800&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(-45deg, #0a0a0a, #1a0033, #0d1117, #1a1a2e, #0f0f23);
      background-size: 600% 600%;
      animation: cosmicPulse 15s ease infinite;
      color: #00ff88;
      font-family: 'Exo 2', sans-serif;
      text-align: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    
    @keyframes cosmicPulse {
      0%, 100% { background-position: 0% 50%; }
      25% { background-position: 100% 50%; }
      50% { background-position: 100% 100%; }
      75% { background-position: 0% 100%; }
    }
    
    /* DYNAMIC STARFIELD */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(1px 1px at 15% 25%, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 75% 65%, #00ff88, transparent),
        radial-gradient(1px 1px at 45% 85%, #ff00ff, transparent),
        radial-gradient(0.8px 0.8px at 85% 35%, #00ccff, transparent),
        radial-gradient(1.2px 1.2px at 25% 15%, #ffff88, transparent),
        radial-gradient(0.6px 0.6px at 65% 85%, #ff6600, transparent);
      background-repeat: repeat;
      background-size: 400px 250px;
      animation: starDrift 30s linear infinite;
      opacity: 0.35;
      z-index: 0;
    }
    
    @keyframes starDrift {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-120px) rotate(180deg); }
    }
    
    .main-container {
      position: relative;
      z-index: 2;
      padding: 25px 15px;
      max-width: 1100px;
      margin: 0 auto;
    }
    
    h1 {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2.5em, 8vw, 5em);
      font-weight: 900;
      margin: 15px 0 10px 0;
      background: linear-gradient(45deg, #00ff88, #00ccff, #ff00ff, #ffff00, #ff6600);
      background-size: 500% 500%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: spectrumGlow 4s ease infinite;
      text-shadow: 0 0 40px rgba(0, 255, 136, 0.6);
      letter-spacing: 6px;
    }
    
    @keyframes spectrumGlow {
      0% { background-position: 0% 50%; }
      25% { background-position: 100% 50%; }
      50% { background-position: 100% 100%; }
      75% { background-position: 0% 100%; }
      100% { background-position: 0% 50%; }
    }
    
    .subtitle {
      font-size: clamp(1.1em, 4vw, 1.6em);
      margin-bottom: 25px;
      color: #00ccff;
      text-shadow: 0 0 20px rgba(0, 204, 255, 0.6);
      font-weight: 600;
      animation: neonFlicker 3s ease infinite;
    }
    
    @keyframes neonFlicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    
    #deviceInfo {
      margin: 10px 0 25px 0;
      font-size: clamp(0.9em, 3vw, 1.2em);
      padding: 12px 20px;
      background: rgba(26, 26, 46, 0.8);
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 25px;
      backdrop-filter: blur(10px);
      display: inline-block;
      font-weight: 600;
      letter-spacing: 1px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }
    
    .mobile #deviceInfo { 
      background: linear-gradient(145deg, rgba(255, 68, 68, 0.2), rgba(255, 102, 102, 0.2));
      border-color: rgba(255, 68, 68, 0.5);
      color: #ff6666;
    }
    
    .pc #deviceInfo { 
      background: linear-gradient(145deg, rgba(0, 255, 136, 0.2), rgba(0, 204, 102, 0.2));
      border-color: rgba(0, 255, 136, 0.5);
      color: #00ff88;
    }
    
    h2 {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1.8em, 6vw, 3em);
      margin: 35px 0 45px 0;
      color: #ffffff;
      text-shadow: 
        0 0 15px #00ff88,
        0 0 25px #00ff88,
        0 0 35px #00ff88;
      font-weight: 800;
      letter-spacing: 4px;
    }
    
    .section {
      display: none;
      animation: portalEnter 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    
    .section.active {
      display: block;
    }
    
    @keyframes portalEnter {
      0% {
        opacity: 0;
        transform: scale(0.7) translateY(60px) rotateX(20deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotateX(0deg);
      }
    }
    
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(200px, 95vw), 1fr));
      gap: 22px;
      margin-bottom: 25px;
      padding: 0 10px;
    }
    
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      max-width: 700px;
      margin: 0 auto 25px;
    }
    
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 22px;
      max-width: 900px;
      margin: 0 auto 25px;
    }
    
    button {
      padding: 24px 32px;
      font-size: clamp(16px, 4vw, 20px);
      font-weight: 800;
      font-family: 'Orbitron', monospace;
      cursor: pointer;
      border: 2px solid rgba(0, 255, 136, 0.3);
      border-radius: 25px;
      background: linear-gradient(145deg, rgba(26, 26, 46, 0.95), rgba(22, 33, 62, 0.95));
      color: #00ff88;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 
        0 12px 40px rgba(0, 0, 0, 0.6),
        0 0 20px rgba(0, 255, 136, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 120%;
      height: 100%;
      background: linear-gradient(90deg, 
        transparent, 
        rgba(255, 255, 255, 0.5), 
        rgba(0, 255, 136, 0.4),
        transparent
      );
      transition: left 0.8s ease;
    }
    
    button:hover::before {
      left: 100%;
    }
    
    button:hover {
      transform: translateY(-12px) scale(1.1);
      border-color: #00ff88;
      box-shadow: 
        0 30px 70px rgba(0, 255, 136, 0.7),
        0 0 50px rgba(0, 255, 136, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
      background: linear-gradient(145deg, #00ff88, #00cc66) !important;
      color: #000 !important;
      text-shadow: 0 0 15px rgba(255, 255, 255, 1);
    }
    
    button:active {
      transform: translateY(-6px) scale(1.05);
    }
    
    .back-btn {
      background: linear-gradient(145deg, #ff4444, #cc3333) !important;
      color: white !important;
      border-color: rgba(255, 68, 68, 0.6) !important;
      font-size: clamp(14px, 3.5vw, 18px) !important;
      padding: 18px 28px !important;
      margin: 25px auto 0 !important;
      max-width: 250px;
      display: block !important;
    }
    
    .back-btn:hover {
      background: linear-gradient(145deg, #ff6666, #ff4444) !important;
      box-shadow: 
        0 30px 70px rgba(255, 68, 68, 0.8),
        0 0 50px rgba(255, 68, 68, 0.6) !important;
      color: white !important;
    }
    
    .ultra-player {
      background: linear-gradient(145deg, #ff0066, #cc0033) !important;
      border-color: #ff0066 !important;
      color: white !important;
      box-shadow: 
        0 18px 50px rgba(255, 0, 102, 0.7),
        0 0 30px rgba(255, 0, 102, 0.4) !important;
      font-size: clamp(18px, 4.5vw, 22px) !important;
    }
    
    .ultra-player:hover {
      background: linear-gradient(145deg, #ff3399, #ff0066) !important;
      box-shadow: 
        0 35px 80px rgba(255, 0, 102, 0.9),
        0 0 60px rgba(255, 0, 102, 0.7) !important;
      color: white !important;
    }
    
    .footer {
      position: fixed;
      bottom: 15px;
      left: 0;
      right: 0;
      font-size: clamp(12px, 2.5vw, 14px);
      color: #888;
      font-family: 'Orbitron', monospace;
      letter-spacing: 1.5px;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
      z-index: 1;
      padding: 10px;
    }
    
    /* MOBILE OPTIMIZATION */
    @media (max-width: 480px) {
      .main-container { padding: 20px 10px; }
      button { 
        padding: 22px 25px !important;
        min-height: 70px !important;
      }
      .game-grid, .players-grid { 
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 15px !important;
      }
      h1 { letter-spacing: 3px !important; }
    }
    
    @media (max-width: 320px) {
      .game-grid, .players-grid { 
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>

<body>
  <div class="main-container">
    <h1>🎮 FREE GAME LUA HUB</h1>
    <p class="subtitle">1 Device • Multiplayer Chaos 🔥</p>
    <div id="deviceInfo"></div>

    <!-- GAME -->
    <div id="menuGame" class="section active">
      <h2>🚀 PILIH GAME</h2>
      <div class="game-grid">
        <button onclick="pilihGame('tank.html')">🔫 TANK</button>
        <button onclick="pilihGame('race.html')">🏁 RACE</button>
        <button onclick="pilihGame('bomb.html')">💣 BOMB</button>
        <button onclick="pilihGame('soccer.html')">⚽ SOCCER</button>
        <button onclick="pilihGame('snake.html')">🐍 SNAKE</button>
      </div>
    </div>

    <!-- MODE -->
    <div id="mode" class="section">
      <h2>⚡ PILIH MODE</h2>
      <div class="mode-grid">
        <button onclick="single()">👤 SINGLE</button>
        <button onclick="multi()">👥 MULTIPLAYER</button>
      </div>
      <button class="back-btn" onclick="back()">⬅ KEMBALI</button>
    </div>

    <!-- PLAYER -->
    <div id="players" class="section">
      <h2>👥 JUMLAH PLAYER</h2>
      <div class="players-grid">
        <button onclick="startGame(2)">2</button>
        <button onclick="startGame(3)">3</button>
        <button onclick="startGame(4)">4</button>
        <button onclick="startGame(5)">5</button>
        <button onclick="startGame(6)" class="ultra-player">🔥 6</button>
      </div>
      <button class="back-btn" onclick="backMode()">⬅ KEMBALI</button>
    </div>
  </div>

  <div class="footer">FreeGameLuaHub © 2026 | Universal Device Engine</div>

  <script>
    let selectedGame = "";
    
    // DETECT DEVICE - LOGIC SAMA PERSIS
    let isMobile = /Mobi|Android/i.test(navigator.userAgent);
    const deviceInfo = document.getElementById("deviceInfo");
    const body = document.body;
    
    if (isMobile) {
      deviceInfo.innerHTML = "📱 <strong>MODE HP</strong><br>Touch Control Activated";
      deviceInfo.className = "mobile";
      body.classList.add("mobile");
    } else {
      deviceInfo.innerHTML = "💻 <strong>MODE PC</strong><br>Keyboard Precision";
      deviceInfo.className = "pc";
      body.classList.add("pc");
    }

    // DOM ELEMENTS
    const menuGame = document.getElementById("menuGame");
    const mode = document.getElementById("mode");
    const players = document.getElementById("players");

    // PILIH GAME - LOGIC SAMA
    function pilihGame(game) {
      selectedGame = game;
      hideAllSections();
      mode.classList.add("active");
    }

    // SINGLE - LOGIC SAMA
    function single() {
      window.location.href = selectedGame + "?mode=single&players=1&device=" + (isMobile ? "mobile" : "pc");
    }

    // MULTI - LOGIC SAMA
    function multi() {
      hideAllSections();
      players.classList.add("active");
    }

    // START - LOGIC SAMA
    function startGame(jumlah) {
      window.location.href = selectedGame + "?mode=multi&players=" + jumlah + "&device=" + (isMobile ? "mobile" : "pc");
    }

    // BACK - LOGIC SAMA
    function back() {
      hideAllSections();
      menuGame.classList.add("active");
    }

    function backMode() {
      hideAllSections();
      mode.classList.add("active");
    }

    function hideAllSections() {
      document.querySelectorAll('.section').forEach(section => {
        section.classList.remove('active');
      });
    }
  </script>
</body>
</html>
