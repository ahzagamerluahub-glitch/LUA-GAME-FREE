<!DOCTYPE html>
<html>
<head>
  <title>🎮 FREE GAME LUA HUB</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@400;600;800&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(-45deg, #0a0a0a, #1a0033, #0d1117, #1a1a2e);
      background-size: 500% 500%;
      animation: cosmicShift 12s ease infinite;
      color: #00ff88;
      font-family: 'Exo 2', sans-serif;
      text-align: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    
    @keyframes cosmicShift {
      0% { background-position: 0% 50%; }
      25% { background-position: 100% 50%; }
      50% { background-position: 100% 100%; }
      75% { background-position: 0% 100%; }
      100% { background-position: 0% 50%; }
    }
    
    /* STARFIELD EFFECT */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(1px 1px at 20% 30%, #ffffff, transparent),
        radial-gradient(1px 1px at 80% 70%, #00ff88, transparent),
        radial-gradient(2px 2px at 40% 80%, #ff00ff, transparent),
        radial-gradient(1px 1px at 90% 40%, #00ccff, transparent),
        radial-gradient(0.5px 0.5px at 30% 20%, #ffff88, transparent),
        radial-gradient(1px 1px at 70% 90%, #ff6600, transparent);
      background-repeat: repeat;
      background-size: 300px 200px;
      animation: starfield 25s linear infinite;
      opacity: 0.4;
      z-index: 0;
    }
    
    @keyframes starfield {
      from { transform: translateY(0px) rotate(0deg); }
      to { transform: translateY(-100px) rotate(360deg); }
    }
    
    .container {
      position: relative;
      z-index: 2;
      padding: 30px 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    
    h1 {
      font-family: 'Orbitron', monospace;
      font-size: 4em;
      font-weight: 900;
      margin: 20px 0;
      background: linear-gradient(45deg, #00ff88, #00ccff, #ff00ff, #ffff00);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: rainbowText 3s ease infinite;
      text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
      letter-spacing: 8px;
    }
    
    @keyframes rainbowText {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .subtitle {
      font-size: 1.4em;
      margin-bottom: 40px;
      color: #00ccff;
      text-shadow: 0 0 15px rgba(0, 204, 255, 0.5);
      font-weight: 600;
      animation: pulse 2s ease infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    h2 {
      font-family: 'Orbitron', monospace;
      font-size: 2.5em;
      margin: 30px 0 40px 0;
      color: #ffffff;
      text-shadow: 
        0 0 10px #00ff88,
        0 0 20px #00ff88;
      font-weight: 700;
      letter-spacing: 3px;
    }
    
    .section {
      display: none;
      animation: slideInUp 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    
    .section.active {
      display: block;
    }
    
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(50px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      margin-bottom: 20px;
    }
    
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 600px;
      margin: 0 auto 20px;
    }
    
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 800px;
      margin: 0 auto 20px;
    }
    
    button {
      padding: 22px 30px;
      font-size: 18px;
      font-weight: 700;
      font-family: 'Orbitron', monospace;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 20px;
      background: linear-gradient(145deg, #1a1a2e, #16213e);
      color: #00ff88;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.6s;
    }
    
    button:hover::before {
      left: 100%;
    }
    
    button:hover {
      transform: translateY(-8px) scale(1.08);
      border-color: #00ff88;
      box-shadow: 
        0 20px 50px rgba(0, 255, 136, 0.6),
        0 0 30px rgba(0, 255, 136, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      background: linear-gradient(145deg, #00ff88, #00cc66);
      color: #000;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }
    
    button:active {
      transform: translateY(-4px) scale(1.04);
    }
    
    .back-btn {
      background: linear-gradient(145deg, #ff4444, #cc3333) !important;
      color: white !important;
      font-size: 16px;
      padding: 15px 25px;
      margin-top: 20px;
      max-width: 200px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .back-btn:hover {
      background: linear-gradient(145deg, #ff6666, #ff4444) !important;
      box-shadow: 
        0 20px 50px rgba(255, 68, 68, 0.6),
        0 0 30px rgba(255, 68, 68, 0.4) !important;
      color: white !important;
    }
    
    .ultra-player {
      background: linear-gradient(145deg, #ff0066, #cc0033) !important;
      border-color: #ff0066 !important;
      color: white !important;
      box-shadow: 
        0 15px 40px rgba(255, 0, 102, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.2) !important;
    }
    
    .ultra-player:hover {
      background: linear-gradient(145deg, #ff3399, #ff0066) !important;
      box-shadow: 
        0 25px 60px rgba(255, 0, 102, 0.8),
        0 0 40px rgba(255, 0, 102, 0.6) !important;
      color: white !important;
    }
    
    .footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      font-size: 14px;
      color: #888;
      font-family: 'Orbitron', monospace;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      z-index: 1;
    }
    
    /* RESPONSIVE */
    @media (max-width: 768px) {
      h1 { font-size: 2.8em; letter-spacing: 4px; }
      h2 { font-size: 2em; }
      .game-grid, .players-grid { grid-template-columns: 1fr; }
      .mode-grid { grid-template-columns: 1fr; }
      button { padding: 20px 25px; font-size: 16px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎮 FREE GAME LUA HUB</h1>
    <p class="subtitle">1 Keyboard • Multiplayer Chaos 🔥</p>

    <!-- PILIH GAME -->
    <div id="menuGame" class="section active">
      <h2>🚀 PILIH GAME</h2>
      <div class="game-grid">
        <button onclick="pilihGame('tank.html')">🔫 TANK WAR</button>
        <button onclick="pilihGame('race.html')">🏁 RACE</button>
        <button onclick="pilihGame('bomb.html')">💣 BOMB ARENA</button>
        <button onclick="pilihGame('soccer.html')">⚽ SOCCER</button>
        <button onclick="pilihGame('snake.html')">🐍 SNAKE</button>
      </div>
    </div>

    <!-- PILIH MODE -->
    <div id="mode" class="section">
      <h2>⚡ PILIH MODE</h2>
      <div class="mode-grid">
        <button onclick="single()">👤 SINGLE PLAYER</button>
        <button onclick="multi()">👥 MULTIPLAYER</button>
      </div>
      <button class="back-btn" onclick="back()">⬅ KEMBALI</button>
    </div>

    <!-- PILIH PLAYER -->
    <div id="players" class="section">
      <h2>👥 JUMLAH PLAYER</h2>
      <div class="players-grid">
        <button onclick="startGame(2)">2 PLAYER</button>
        <button onclick="startGame(3)">3 PLAYER</button>
        <button onclick="startGame(4)">4 PLAYER</button>
        <button onclick="startGame(5)">5 PLAYER</button>
        <button onclick="startGame(6)" class="ultra-player">🔥 6 PLAYER ULTRA</button>
      </div>
      <button class="back-btn" onclick="backMode()">⬅ KEMBALI</button>
    </div>
  </div>

  <div class="footer">
    FreeGameLuaHub © 2026 | Powered by LuaScript Engine
  </div>

  <script>
    let selectedGame = "";

    // pilih game
    function pilihGame(game) {
      selectedGame = game;
      hideAllSections();
      document.getElementById("mode").classList.add("active");
    }

    // single
    function single() {
      window.location.href = selectedGame + "?mode=single&players=1";
    }

    // multi
    function multi() {
      hideAllSections();
      document.getElementById("players").classList.add("active");
    }

    // start game
    function startGame(jumlah) {
      window.location.href = selectedGame + "?mode=multi&players=" + jumlah;
    }

    // back ke menu game
    function back() {
      hideAllSections();
      document.getElementById("menuGame").classList.add("active");
    }

    // back ke mode
    function backMode() {
      hideAllSections();
      document.getElementById("mode").classList.add("active");
    }

    function hideAllSections() {
      const sections = document.querySelectorAll('.section');
      sections.forEach(section => {
        section.classList.remove('active');
      });
    }
  </script>
</body>
</html>
