<!DOCTYPE html>
<html>
<head>
  <title>🚀 GAME HUB ULTRA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(-45deg, #000000, #1a0033, #000033, #330066);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      color: #00ff88;
      text-align: center;
      font-family: 'Orbitron', monospace;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    /* Particle Background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #00ff88, transparent),
        radial-gradient(2px 2px at 40px 70px, #ff00ff, transparent),
        radial-gradient(1px 1px at 90px 40px, #00ccff, transparent),
        radial-gradient(1px 1px at 130px 80px, #ffff00, transparent);
      background-repeat: repeat;
      background-size: 200px 100px;
      animation: float 20s linear infinite;
      opacity: 0.3;
      z-index: 0;
    }
    
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-100px) rotate(360deg); }
    }
    
    .container {
      position: relative;
      z-index: 1;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    
    h1 {
      font-size: 3.5em;
      font-weight: 900;
      text-shadow: 
        0 0 10px #00ff88,
        0 0 20px #00ff88,
        0 0 30px #00ff88;
      margin-bottom: 20px;
      animation: glow 2s ease-in-out infinite alternate;
      letter-spacing: 5px;
    }
    
    @keyframes glow {
      from { text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 30px #00ff88; }
      to { text-shadow: 0 0 20px #00ff88, 0 0 30px #00ff88, 0 0 40px #00ff88, 0 0 50px #00ff88; }
    }
    
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    button {
      padding: 20px 25px;
      font-size: 18px;
      font-weight: 700;
      font-family: 'Orbitron', monospace;
      cursor: pointer;
      border: none;
      border-radius: 15px;
      background: linear-gradient(45deg, #1a1a2e, #16213e);
      color: #00ff88;
      box-shadow: 
        0 8px 25px rgba(0, 255, 136, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }
    
    button:hover::before {
      left: 100%;
    }
    
    button:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 
        0 15px 35px rgba(0, 255, 136, 0.5),
        0 0 20px rgba(0, 255, 136, 0.3);
      background: linear-gradient(45deg, #00ff88, #00cc66);
      color: #000;
    }
    
    button:active {
      transform: translateY(-2px) scale(1.02);
    }
    
    .section {
      display: none;
      animation: fadeInUp 0.8s ease-out;
      margin: 40px 0;
    }
    
    .section.active {
      display: block;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    h2 {
      font-size: 2.2em;
      margin-bottom: 30px;
      text-shadow: 0 0 15px #00ff88;
      font-weight: 700;
    }
    
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }
    
    .special-player {
      background: linear-gradient(45deg, #ff0066, #ff6600) !important;
      color: white !important;
      box-shadow: 0 10px 30px rgba(255, 0, 102, 0.5) !important;
    }
    
    .special-player:hover {
      background: linear-gradient(45deg, #ff3399, #ff9933) !important;
      box-shadow: 0 15px 40px rgba(255, 0, 102, 0.7) !important;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      h1 { font-size: 2.5em; }
      h2 { font-size: 1.8em; }
      button { padding: 18px 20px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 GAME HUB ULTRA</h1>

    <div id="menuGame" class="section active">
      <div class="game-grid">
        <button onclick="pilihGame('tank.html')">⚔️ GAME TANK</button>
        <button onclick="pilihGame('soccer.html')">🎯 GAME 2</button>
        <button onclick="pilihGame('snake.html')">🚀 GAME 3</button>
        <button onclick="pilihGame('race.html')">⚡ GAME 4</button>
        <button onclick="pilihGame('bomb.html')">💥 GAME 5</button>
      </div>
    </div>

    <div id="mode" class="section">
      <h2>⚡ PILIH MODE</h2>
      <div class="game-grid">
        <button onclick="single()">🎮 Single Player</button>
        <button onclick="multi()">👥 Multiplayer</button>
      </div>
    </div>

    <div id="players" class="section">
      <h2>👥 JUMLAH PLAYER</h2>
      <div class="players-grid">
        <button onclick="startGame(2)">2 Player</button>
        <button onclick="startGame(3)">3 Player</button>
        <button onclick="startGame(4)">4 Player</button>
        <button onclick="startGame(5)">5 Player</button>
        <button onclick="startGame(6)" class="special-player">🔥 6 Player ULTRA</button>
      </div>
    </div>
  </div>

  <script>
    let selectedGame = "";

    function pilihGame(game) {
      selectedGame = game;
      hideAllSections();
      document.getElementById("mode").classList.add("active");
    }

    function single() {
      window.location.href = selectedGame + "?mode=single";
    }

    function multi() {
      hideAllSections();
      document.getElementById("players").classList.add("active");
    }

    function startGame(jumlah) {
      window.location.href = selectedGame + "?mode=multi&players=" + jumlah;
    }

    function hideAllSections() {
      const sections = document.querySelectorAll('.section');
      sections.forEach(section => {
        section.classList.remove('active');
      });
    }
  </script>
</body>
</html>
