<!DOCTYPE html>
<html>
<body style="margin:0;background:black">
<button onclick="location.href='index.html'">⬅ Menu</button>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
c.width=800;c.height=500;

let n=parseInt(new URLSearchParams(location.search).get("players"))||2;
const keys=["a","s","d","f","g","h"];

let snakes=[];

for(let i=0;i<n;i++){
 snakes.push({
  body:[{x:100+i*50,y:100}],
  dx:2,dy:0,
  key:keys[i],
  alive:true
 });
}

let food={x:400,y:250};

onkeydown=e=>{
 snakes.forEach(s=>{
  if(e.key==s.key){
   let t=s.dx;
   s.dx=-s.dy;
   s.dy=t;
  }
 });
};

function loop(){
 ctx.fillStyle="#000";
 ctx.fillRect(0,0,800,500);

 snakes.forEach(s=>{
  if(!s.alive) return;

  let head={x:s.body[0].x+s.dx,y:s.body[0].y+s.dy};
  s.body.unshift(head);

  let d=Math.hypot(head.x-food.x,head.y-food.y);

  if(d<10){
   food.x=Math.random()*800;
   food.y=Math.random()*500;
  }else{
   s.body.pop();
  }

  // mati kalau keluar
  if(head.x<0||head.y<0||head.x>800||head.y>500){
   s.alive=false;
  }

  ctx.fillStyle="lime";
  s.body.forEach(p=>ctx.fillRect(p.x,p.y,10,10));
 });

 ctx.fillStyle="red";
 ctx.fillRect(food.x,food.y,10,10);

 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
